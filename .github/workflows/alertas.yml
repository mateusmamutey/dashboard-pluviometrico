# Alertas do pluviômetro: roda a cada 15 minutos, sem depender de
# alguém abrir o dashboard. Os segredos ficam em
# Settings → Secrets and variables → Actions (veja LEIAME-CONFIGURACAO.md).
#
# Para testar à mão: aba Actions → "Alertas do pluviômetro" → Run workflow.

name: Alertas do pluviômetro

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal, teste (só mostra) ou mensagem-teste"
        required: true
        default: "teste"
        type: choice
        options: [normal, teste, mensagem-teste]

# issues: write deixa o alerta abrir um aviso no repositório quando
# ninguém recebe por e-mail ou WhatsApp (o GitHub manda e-mail ao dono).
permissions:
  contents: read
  issues: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-alertas.txt

      - run: pip install -r requirements-alertas.txt

      - name: Avaliar e enviar alertas
        env:
          # Basta o STREAMLIT_SECRETS (texto inteiro dos Secrets do
          # Streamlit). SMTP_USUARIO e SMTP_SENHA mandam e-mail aos
          # contatos; sem eles, o alerta vira aviso no GitHub.
          STREAMLIT_SECRETS: ${{ secrets.STREAMLIT_SECRETS }}
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          LICOR_TOKEN: ${{ secrets.LICOR_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PLANILHA_URL: ${{ secrets.PLANILHA_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          SMTP_REMETENTE: ${{ secrets.SMTP_REMETENTE }}
          MODO: ${{ github.event.inputs.modo || 'normal' }}
        run: |
          # Enquanto os segredos não forem configurados, não falha a
          # cada 15 min (o GitHub mandaria um e-mail por falha).
          if [ -z "$STREAMLIT_SECRETS" ] && { [ -z "$PLANILHA_URL" ] || [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; }; then
            echo "::notice::Segredos dos alertas ainda não configurados. Veja LEIAME-CONFIGURACAO.md."
            exit 0
          fi
          if [ "$MODO" = "teste" ]; then
            python alertas.py --teste
          elif [ "$MODO" = "mensagem-teste" ]; then
            python alertas.py --mensagem-teste
          else
            python alertas.py
          fi
